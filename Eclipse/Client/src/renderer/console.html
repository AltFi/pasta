<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:;" />
    <title>PulseExecutor Console</title>
    <link rel="stylesheet" href="./styles/theme.css" />
  </head>
  <body>
    <div class="console-shell">
      <div class="console-window-header" id="console-window-header">
        <button class="console-collapse" id="console-collapse" title="Collapse" aria-label="Collapse">
          <svg viewBox="0 0 10 10"><path d="M2 3.5 5 6.5 8 3.5" /></svg>
        </button>
        <span class="console-tab-pill">Console</span>
        <input class="console-filter" id="console-filter" type="text" placeholder="Filter output…" spellcheck="false" />
        <button class="console-action" id="console-clear-btn">Clear</button>
        <button class="console-window-close" id="console-close-btn" title="Hide" aria-label="Hide">
          <svg viewBox="0 0 10 10"><path d="M2 2l6 6M8 2L2 8" /></svg>
        </button>
      </div>
      <div class="console-window-body" id="console-body"></div>
    </div>

    <script type="module" src="./console.ts"></script>
  </body>
</html>
